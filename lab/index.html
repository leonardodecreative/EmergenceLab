<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergence Lab V2 — Live Lab</title><link rel="stylesheet" href="../shared/el-style.css"><script src="../shared/el-bridge.js"></script><style>body{overflow-x:hidden}.lab-wrap{max-width:1500px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px}.stage{position:relative;min-height:740px;overflow:hidden}.stage canvas{width:100%;height:740px;display:block}.hud{position:absolute;left:18px;top:18px;right:18px;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}.hud span{background:rgba(3,6,14,.66);border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--muted);font-size:12px}.hud b{color:var(--text)}.controls{display:grid;gap:14px}.control-row{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center}.control-row label{font-size:12px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--cyan)}.embedded header{display:none}.embedded .lab-wrap{padding:0;grid-template-columns:minmax(0,1fr) 350px}.embedded main{padding:0}.embedded .stage{border-radius:22px}.embedded .stage canvas{height:680px}@media(max-width:1050px){.lab-wrap,.embedded .lab-wrap{grid-template-columns:1fr}.stage canvas{height:620px}.embedded .stage canvas{height:620px}}</style></head><body><header><nav><a class="brand" href="../site/index.html"><span class="sig"></span><span>Emergence Lab V2 Live Lab</span></a><div class="navlinks"><a href="../site/index.html">Website</a></div></nav></header><main class="lab-wrap"><section class="panel stage"><div class="hud"><span>time <b id="hTime">0.0</b></span><span>nodes <b id="hNodes">1</b></span><span>transfers <b id="hTransfers">0</b></span><span>mode <b id="hMode">running</b></span><span>bridge <b>online</b></span></div><canvas id="field"></canvas></section><aside class="controls"><section class="panel card"><div class="kicker">Experiment controls</div><p><button id="start">Start</button> <button id="pause">Pause</button> <button id="reset">Reset</button> <button id="single">Single</button> <button id="multi">Multi</button></p><p><button id="perturb">Perturb</button> <button id="stabilize">Stabilize</button></p></section><section class="panel card" id="sliders"></section><section class="panel card"><h3>Selected node</h3><div class="feed" id="inspect">Nucleus anchored. Waiting for telemetry.</div></section></aside></main><script>if(new URL(location.href).searchParams.get('embedded'))document.body.classList.add('embedded');const canvas=document.getElementById('field'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,time=0,running=true,transfers=0,selected=0;const sliders={nodeX:[.5,0,1,.01,'X identity / horizontal radial'],nodeY:[.35,0,1,.01,'Y memory / vertical radial'],nodeZ1:[.6,0,1,.01,'Z₁ recovery recoil'],nodeZ2:[.6,0,1,.01,'Z₂ integration transfer'],thetaFrequency:[.44,0,1,.01,'Θ frequency'],thetaPhase:[.34,0,1,.01,'Θ phase'],thetaAmplitude:[.54,0,1,.01,'Θ amplitude'],thetaCoherence:[.58,0,1,.01,'Θ coherence'],gamma:[1,.1,5,.1,'Γ legacy / forward influence'],nodeCount:[1,1,24,1,'Node count'],entropy:[.2,0,1,.01,'Environment entropy'],perturbationStrength:[.28,0,1,.01,'Perturbation'],interactionRadius:[150,50,320,1,'Interaction radius'],timeScale:[1,.2,3,.1,'Time scale'],simulationSpeed:[1,.2,3,.1,'Simulation speed'],writeGate:[.42,.05,.95,.01,'Transfer/write gate'],nodeSize:[1.2,.6,2.6,.1,'Node size'],thetaToZ2:[.35,0,1,.01,'Θ → Z₂'],z1ToY:[.12,0,1,.01,'Z₁ → Y'],z2ToY:[.28,0,1,.01,'Z₂ → Y'],yToTheta:[.24,0,1,.01,'Y → Θ'],neighborToX:[.22,0,1,.01,'Neighbor → X'],neighborToY:[.22,0,1,.01,'Neighbor → Y'],neighborToZ2:[.26,0,1,.01,'Neighbor → Z₂'],neighborToTheta:[.34,0,1,.01,'Neighbor → Θ']};const state={},nodes=[];document.getElementById('sliders').innerHTML='<h3>Old + new controls</h3>'+Object.entries(sliders).map(([id,c])=>{const[v,min,max,step,label]=c;state[id]=v;return`<div class="control-row"><label for="${id}">${label}</label><output id="${id}Out">${v}</output><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${v}" style="grid-column:1/3"></div>`}).join('');Object.keys(sliders).forEach(id=>{const el=document.getElementById(id),out=document.getElementById(id+'Out');el.oninput=()=>{state[id]=parseFloat(el.value);out.textContent=Number(state[id]).toFixed(id==='nodeCount'||id==='interactionRadius'?0:2);syncNodeFromControls()}});function clamp(v,min=0,max=1){return Math.max(min,Math.min(max,v))}function rand(seed){let s=seed>>>0;return()=>((s=(1664525*s+1013904223)>>>0)/4294967296)}const R=rand(42);function createNode(i){return{id:i+1,x:W/2+(R()-.5)*W*.35,y:H/2+(R()-.5)*H*.35,vx:(R()-.5)*18,vy:(R()-.5)*18,X:state.nodeX,Y:state.nodeY,Z1:state.nodeZ1,Z2:state.nodeZ2,theta:state.thetaFrequency,phase:R(),amp:state.thetaAmplitude,coh:state.thetaCoherence,gamma:state.gamma,env:0,trail:[],flash:0}}function setNodeCount(n){while(nodes.length<n)nodes.push(createNode(nodes.length));while(nodes.length>n)nodes.pop();selected=0}function syncNodeFromControls(){const n=nodes[selected]||nodes[0];if(!n)return;n.X=state.nodeX;n.Y=state.nodeY;n.Z1=state.nodeZ1;n.Z2=state.nodeZ2;n.theta=state.thetaFrequency;n.amp=state.thetaAmplitude;n.coh=state.thetaCoherence;n.gamma=state.gamma;setNodeCount(state.nodeCount|0)}function resize(){dpr=Math.min(devicePixelRatio||1,2);const r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!nodes.length)setNodeCount(state.nodeCount|0)}addEventListener('resize',resize);function update(dt){const speed=state.timeScale*state.simulationSpeed;time+=dt*speed;const target=state.nodeCount|0;if(nodes.length!==target)setNodeCount(target);for(const n of nodes){n.env=clamp(.5+.25*Math.sin(time*.7+n.x*.01)+.2*Math.cos(time*.41+n.y*.012)+state.perturbationStrength*.3);let nx=0,ny=0,neighbors=0,thetaAlign=0;for(const m of nodes){if(m===n)continue;const dx=m.x-n.x,dy=m.y-n.y,d=Math.hypot(dx,dy);if(d<state.interactionRadius){const w=1-d/state.interactionRadius;nx+=dx*w;ny+=dy*w;thetaAlign+=(1-Math.abs(m.theta-n.theta))*w;neighbors+=w}}if(neighbors){n.vx+=nx/neighbors*.0009*state.neighborToX;n.vy+=ny/neighbors*.0009*state.neighborToY;n.theta=clamp(n.theta+thetaAlign/neighbors*.0007*state.neighborToTheta);n.Z2=clamp(n.Z2+neighbors*.00004*state.neighborToZ2)}n.Z2=clamp(n.Z2+(n.coh*state.thetaToZ2+(n.env-.5)*state.perturbationStrength)*.0009*speed);n.Y=clamp(n.Y+(n.Z2*state.z2ToY+n.Z1*state.z1ToY)*.0005*speed);n.coh=clamp(n.coh+(n.Y*state.yToTheta-state.entropy*.04)*.0009*speed);n.phase=(n.phase+n.theta*.018*speed)%1;n.x+=n.vx*dt*speed;n.y+=n.vy*dt*speed;n.vx*=.992;n.vy*=.992;if(state.entropy){n.vx+=(Math.sin(time+n.id)*.5)*state.entropy*.02;n.vy+=(Math.cos(time*.9+n.id)*.5)*state.entropy*.02}if(n.x<30||n.x>W-30)n.vx*=-1;if(n.y<30||n.y>H-30)n.vy*=-1;n.x=clamp(n.x,30,W-30);n.y=clamp(n.y,30,H-30);if(n.X>state.writeGate&&n.coh>.25&&n.Z2>.45){transfers++;n.flash=1;n.Z2=clamp(n.Z2-.012);n.Z1=clamp(n.Z1+.006)}n.flash=Math.max(0,n.flash-dt*1.8);n.trail.push({x:n.x,y:n.y});if(n.trail.length>80)n.trail.shift()}}function drawNode(n){const scale=(state.nodeSize||1)*(.7+n.X*.55),Rn=30*scale,cx=n.x,cy=n.y,hue=185+n.theta*120;if(n.trail.length>1){ctx.strokeStyle=`hsla(${hue},80%,65%,.28)`;ctx.lineWidth=1.2;ctx.beginPath();n.trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,Rn*3);glow.addColorStop(0,`hsla(${hue},100%,70%,${.22+n.Y*.25})`);glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,Rn*3,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(cx,cy);ctx.rotate(n.phase*Math.PI*2);[[0,1.6,.23,'rgba(56,243,255,.92)'],[Math.PI/2,1.6,.23,'rgba(215,80,255,.82)'],[Math.PI/4,1.4,.18,'rgba(255,213,93,.68)'],[-Math.PI/4,1.4,.18,'rgba(77,255,154,.55)']].forEach(o=>{ctx.save();ctx.rotate(o[0]);ctx.scale(o[1],o[2]);ctx.strokeStyle=o[3];ctx.lineWidth=2/o[1];ctx.beginPath();ctx.arc(0,0,Rn,0,Math.PI*2);ctx.stroke();ctx.restore()});for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.strokeStyle=i%2?'rgba(215,80,255,.55)':'rgba(56,243,255,.65)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(Math.cos(a)*Rn*.35,Math.sin(a)*Rn*.35);ctx.lineTo(Math.cos(a)*Rn*1.55,Math.sin(a)*Rn*1.55);ctx.stroke()}for(let i=0;i<12;i++){const a=i*Math.PI*2/12+n.phase*Math.PI*2;ctx.fillStyle=i%3===0?'#38f3ff':i%3===1?'#d750ff':'#ffd55d';ctx.beginPath();ctx.arc(Math.cos(a)*Rn*1.25,Math.sin(a)*Rn*(i%2?.25:1),2.2,0,Math.PI*2);ctx.fill()}ctx.restore();const core=ctx.createRadialGradient(cx,cy,0,cx,cy,Rn*.65);core.addColorStop(0,'#fff');core.addColorStop(.25,'#38f3ff');core.addColorStop(.7,'rgba(215,80,255,.55)');core.addColorStop(1,'rgba(255,61,0,0)');ctx.fillStyle=core;ctx.beginPath();ctx.arc(cx,cy,Rn*.65*(1+n.flash*.25),0,Math.PI*2);ctx.fill()}function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H));bg.addColorStop(0,'#0a1730');bg.addColorStop(1,'#02040b');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(120,170,255,.08)';ctx.lineWidth=1;for(let x=0;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<state.interactionRadius){ctx.strokeStyle=`rgba(56,243,255,${.08+(1-d/state.interactionRadius)*.22})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}nodes.forEach(drawNode)}function publish(){const n=nodes[selected]||nodes[0]||{X:0,Y:0,Z1:0,Z2:0,coh:0,gamma:0,env:0};ELBridge.publishTelemetry({time,nodeCount:nodes.length,transfers,mode:running?'running':'paused',X:n.X,Y:n.Y,Z1:n.Z1,Z2:n.Z2,thetaCoherence:n.coh,gamma:n.gamma,environment:n.env});hTime.textContent=time.toFixed(1);hNodes.textContent=nodes.length;hTransfers.textContent=transfers;hMode.textContent=running?'running':'paused';inspect.innerHTML=`<b>Node ${n.id||1}</b><span>X ${n.X.toFixed(3)} · Y ${n.Y.toFixed(3)}</span><span>Z₁ ${n.Z1.toFixed(3)} · Z₂ ${n.Z2.toFixed(3)}</span><span>Θ coherence ${n.coh.toFixed(3)} · Γ ${n.gamma.toFixed(2)}</span><span>Environment ${n.env.toFixed(3)}</span>`}let last=0,pub=0;function frame(ts){const dt=Math.min(.04,(ts-last)/1000||.016);last=ts;if(running)update(dt);draw();pub+=dt;if(pub>.25){publish();pub=0}requestAnimationFrame(frame)}function command(c){if(c==='start')running=true;if(c==='pause')running=!running;if(c==='reset'){time=0;transfers=0;nodes.length=0;setNodeCount(state.nodeCount|0)}if(c==='multi'){state.nodeCount=8;nodeCount.value=8;nodeCountOut.textContent='8';setNodeCount(8)}if(c==='perturb'){state.perturbationStrength=clamp(state.perturbationStrength+.22);perturbationStrength.value=state.perturbationStrength;perturbationStrengthOut.textContent=state.perturbationStrength.toFixed(2);nodes.forEach(n=>{n.flash=1;n.vx+=(Math.random()-.5)*40;n.vy+=(Math.random()-.5)*40})}if(c==='stabilize'){state.entropy=.08;state.perturbationStrength=.1;['entropy','perturbationStrength'].forEach(id=>{document.getElementById(id).value=state[id];document.getElementById(id+'Out').textContent=state[id].toFixed(2)})}}['start','pause','reset','single','multi','perturb','stabilize'].forEach(id=>document.getElementById(id).onclick=()=>command(id==='single'?'reset':id));ELBridge.on(ev=>{if(ev.type==='command')command(ev.payload.command)});canvas.addEventListener('click',ev=>{const r=canvas.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;let best=0,bd=1e9;nodes.forEach((n,i)=>{const d=Math.hypot(n.x-x,n.y-y);if(d<bd){bd=d;best=i}});selected=best});resize();setNodeCount(1);requestAnimationFrame(frame);</script></body></html>
